[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#080c14"
secondaryBackgroundColor = "#0b0f19"
textColor = "#f8fafc"
font = "sans serif"

[server]
headless = true
maxUploadSize = 100
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
