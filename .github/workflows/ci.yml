name: AUREVIX Continuous Integration (CI)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Code Quality & Security Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lint & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Validate Configuration & Security Manifests
        run: |
          test -f .env.example
          test -f Dockerfile
          test -f docker-compose.yml
          test -f SECURITY.md

      - name: SAST Security Scan (Bandit)
        run: |
          bandit -r src/ dashboard/ -x tests/ -ll

  test-suite:
    name: Automated Regression Suite (45+ Tests)
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17 (for PySpark)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dbt Models & Compilation
        run: |
          dbt parse --project-dir dbt_aurevix --profiles-dir dbt_aurevix

      - name: Execute Full Unit & Integration Test Suite
        run: |
          pytest tests/unit/ tests/integration/ -v
