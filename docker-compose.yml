name: aurevix

services:
  # 1. PostgreSQL 16 Warehouse
  postgres:
    image: postgres:16-alpine
    container_name: aurevix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurevix_dw}
      POSTGRES_USER: ${POSTGRES_USER:-aurevix_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurevix_secure_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurevix_admin} -d ${POSTGRES_DB:-aurevix_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aurevix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  # 3. Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aurevix-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # 4. Streamlit Operations Dashboard
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurevix-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUREVIX_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aurevix_dw}
      POSTGRES_USER: ${POSTGRES_USER:-aurevix_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurevix_secure_password_change_me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
